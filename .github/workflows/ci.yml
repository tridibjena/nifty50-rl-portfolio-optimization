name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The project is a single notebook, so there is no package to import and no test suite
# to run. What CI can still do is keep the notebook reviewable: check that it parses,
# that its code is free of the errors a linter can see without executing it, and that it
# has not started carrying megabytes of embedded output.
jobs:
  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install tooling
        run: pip install ruff nbformat

      # Ruff reads .ipynb directly. This catches undefined names and unused imports --
      # worth having, because in a flat notebook a typo in a name defined thirty cells
      # earlier is otherwise only found by running the whole thing.
      - name: Lint the notebook
        run: ruff check notebooks/ --output-format=github

      - name: Check structure, size and embedded output
        run: |
          python - <<'PY'
          import json, pathlib, sys

          LIMIT_KB = 512
          failed = False

          for nb_path in sorted(pathlib.Path("notebooks").glob("*.ipynb")):
              size_kb = nb_path.stat().st_size / 1024
              nb = json.loads(nb_path.read_text())
              cells = nb.get("cells", [])

              embedded = sum(
                  1
                  for cell in cells
                  for out in cell.get("outputs", [])
                  if any(k.startswith("image/") for k in out.get("data", {}))
              )

              # Running the notebook draws every chart inline, which is the point -- but
              # it also base64-encodes twenty images into the file, taking it from ~400 KB
              # to ~3 MB. Committed that way, each rerun rewrites every image and the diff
              # is unreadable. So: run it locally with the plots, commit it without them.
              # The charts still show on GitHub, because the gallery cells reference
              # assets/v2/ rather than embedding.
              FIX = ("clear outputs before committing: "
                     "jupyter nbconvert --clear-output --inplace notebooks/*.ipynb")

              problems = []
              if embedded:
                  problems.append(f"{embedded} embedded image output(s) -- {FIX}")
              if size_kb > LIMIT_KB:
                  problems.append(f"{size_kb:.0f} KB exceeds the {LIMIT_KB} KB limit -- {FIX}")
              if not cells:
                  problems.append("no cells")

              for problem in problems:
                  print(f"::error file={nb_path}::{problem}")
                  failed = True

              print(f"{nb_path}  {size_kb:7.0f} KB  {len(cells):3d} cells  "
                    f"{embedded} embedded  {'FAIL' if problems else 'ok'}")

          sys.exit(1 if failed else 0)
          PY
