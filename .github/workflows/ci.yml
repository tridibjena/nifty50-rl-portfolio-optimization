name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The whole suite runs on synthetic fixtures -- no network, no market data, no
      # RL stack. That is deliberate: a test suite that needs yfinance is a test suite
      # that fails on someone else's machine for reasons unrelated to the code.
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn matplotlib pytest

      - name: Run tests
        run: python -m pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check src tests scripts --output-format=github

  notebook-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The failure mode to prevent is bloat, not outputs. A narrative notebook is
      # supposed to carry its printed tables -- that is the point of committing one.
      # What made the original repo's duplicate 2.6 MB was *embedded PNGs*, so the gate
      # targets those and the resulting file size directly.
      - name: Check notebook size and embedded images
        run: |
          python - <<'PY'
          import json, pathlib, sys

          LIMIT_KB = 512
          failed = False

          for nb_path in sorted(pathlib.Path(".").glob("**/*.ipynb")):
              if ".ipynb_checkpoints" in nb_path.parts:
                  continue
              size_kb = nb_path.stat().st_size / 1024
              nb = json.loads(nb_path.read_text())
              embedded = sum(
                  1
                  for cell in nb.get("cells", [])
                  for out in cell.get("outputs", [])
                  if any(k.startswith("image/") for k in out.get("data", {}))
              )
              status = "ok"
              if embedded:
                  status = f"::error file={nb_path}::{embedded} embedded image output(s); reference ../assets/ instead"
                  failed = True
              elif size_kb > LIMIT_KB:
                  status = f"::error file={nb_path}::{size_kb:.0f} KB exceeds the {LIMIT_KB} KB limit"
                  failed = True
              print(f"{nb_path}  {size_kb:7.0f} KB  {embedded} embedded  {status}")

          sys.exit(1 if failed else 0)
          PY
